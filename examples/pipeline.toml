# Data pipeline - ordered steps with irreversible side effects.
#
# Use this shape for anything where steps must run in a fixed order and the
# side effects cannot be undone: ETL loads, migrations, batch jobs, index
# rebuilds, bulk imports.
#
# The governing rule:
#
#   A sequence that must be followed exactly should not exist as prose.
#
# If a procedure is written out as numbered steps in a document, someone
# eventually retypes it and drops one. Put the steps in a runner, point the
# document at the runner, and delete the numbered list.

project = "pipeline"
spec = "spec.md"

# The runner and the migrations are not the agent's to rewrite. Hand-written
# scripts that shadow the real runner are the thing this prevents.
protected = ["tests/", "pipeline/", "migrations/", "spec.md"]


# --- preflight: cheap, fails in seconds, runs before anything expensive ---
# Two seconds here beats a forty-minute run that rolls back. Assert the world
# is what you expect before touching it.

[[check]]
name = "preconditions"
cmd = "python -m app.preflight"
expect = 0
description = "required inputs present and consistent before any write"
timeout = 120


# --- the runner is the only supported way to execute the sequence ---

[[check]]
name = "runner_is_the_only_path"
cmd = "python scripts/assert_no_adhoc_scripts.py"
expect = 0
description = "no untracked scratch script that WRITES - read-only probes are fine"

[[check]]
name = "steps_match_spec"
cmd = "python scripts/assert_runner_matches_spec.py"
expect = 0
description = "the runner executes exactly the steps the spec lists, in order"

[[check]]
name = "runner_stops_on_failure"
cmd = "python -m pytest tests/test_runner.py -q"
expect = 0
description = "a failing step halts the chain instead of continuing into a bad state"

[[check]]
name = "runner_can_resume"
cmd = "python -m pytest tests/test_resume.py -q"
expect = 0
description = "the runner resumes mid-sequence - otherwise corrective runs get hand-written"

[[check]]
name = "no_orphan_steps"
cmd = "python -m pytest tests/test_reachability.py -q"
expect = 0
description = "every step module is reachable from the runner, not only from a scratch script"


# --- irreversibility: the property that decides everything here ---

[[check]]
name = "single_transaction"
cmd = "python -m pytest tests/test_transaction.py -q"
expect = 0
description = "the load commits once or not at all"

[[check]]
name = "dry_run_default"
cmd = "python -m app.load --assert-dry-run-default"
expect = 0
description = "writing to production requires an explicit flag, never a default"

[[check]]
name = "idempotent_rerun"
cmd = "python -m pytest tests/test_idempotent.py -q"
expect = 0
description = "running twice produces the same result as running once"

[[check]]
name = "counts_reconcile"
cmd = "python -m app.reconcile"
expect = 0
description = "row counts after the run match what the run claims it did"


# --- guards must be proven in both directions ---
# A guard that only ever passes is decoration. One that blocks normal work
# gets bypassed, and a bypassed guard catches nothing.

[[check]]
name = "guard_works_both_ways"
cmd = "python -m pytest tests/test_guard_behaviour.py -q"
expect = 0
description = "the adhoc guard blocks a write script AND allows a read-only probe"


# --- NOT checkable ---
# Whether this is the right transformation, whether the schema serves the
# questions you want to ask, whether a field should exist at all. Those are
# design calls. Improvise there freely - that is where the thinking happens.
