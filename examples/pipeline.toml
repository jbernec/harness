# ETL pipeline - ordered steps with irreversible side effects.
#
# Read this first:
# This config exists because of a real incident. An agent was told to run a
# six-step procedure documented in the spec. It hand-wrote a "temp script"
# from memory instead, dropped a step, and hit a foreign-key violation.
# Twice in one hour, same root cause. Its own summary: "improvising the
# sequence rather than executing the spec."
#
# The lesson is not "be more careful". It is:
#
#   A sequence that must be followed exactly should not exist as prose.
#
# If the only thing standing between you and a corrupted table is someone
# retyping six steps in the right order, that will fail eventually. Ship a
# runner, make the spec point at it, and there is nothing left to retype.

project = "pipeline"
spec = "spec.md"

# The runner and the migrations are not the agent's to rewrite. The incident
# above WAS a hand-written temp script shadowing the real one.
protected = ["tests/", "pipeline/", "migrations/", "spec.md"]


# --- preflight: cheap, fails in seconds, runs before anything expensive ---
# Both misses in the incident would have been caught here, instantly, before
# the harmoniser started its 45-minute run.

[[check]]
name = "preconditions"
cmd = "python -m etl.preflight"
expect = 0
description = "coords backfilled and orphan alerts cleared before any write"
timeout = 120


# --- the runner is the only supported way to execute the sequence ---

[[check]]
name = "runner_is_the_only_path"
cmd = "python scripts/assert_no_adhoc_scripts.py"
expect = 0
description = "no untracked *.sql or temp_*.py sitting in the working tree"

[[check]]
name = "steps_match_spec"
cmd = "python scripts/assert_runner_matches_spec.py"
expect = 0
description = "pipeline/run.sh executes exactly the steps spec R-101 lists, in order"

[[check]]
name = "runner_stops_on_failure"
cmd = "python -m pytest tests/test_runner.py -q"
expect = 0
description = "a failing step halts the chain instead of continuing into a bad state"


# --- irreversibility: the property that decides everything here ---

[[check]]
name = "single_transaction"
cmd = "python -m pytest tests/test_transaction.py -q"
expect = 0
description = "the harmoniser commits once or not at all - this is what saved the data"

[[check]]
name = "dry_run_default"
cmd = "python -m etl.harmonize --assert-dry-run-default"
expect = 0
description = "writing to production requires an explicit flag, never a default"

[[check]]
name = "idempotent_rerun"
cmd = "python -m pytest tests/test_idempotent.py -q"
expect = 0
description = "running the pipeline twice produces the same row counts as running it once"

[[check]]
name = "row_counts_reconcile"
cmd = "python -m etl.reconcile --expect-observations 7004676"
expect = 0
description = "the number of observations after the run is the number we expect"


# --- NOT checkable ---
# Whether this is the right transformation, whether the schema serves the
# questions you want to ask, whether a column should exist at all. Those are
# design calls. Improvise there freely - that is where the thinking happens.
