[project]
name = "harness"
version = "0.8.0"
description = "Prove an AI coding agent actually did the work: check, red first, trace, gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]


