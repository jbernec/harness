name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest tests -q
        env:
          # The trace and key normally live in ~/.harness. Keep the runner's
          # home clean so a leftover key can never make a test pass.
          HARNESS_HOME: ${{ runner.temp }}/harness-home

  # The install path other projects actually use. If this breaks, every repo
  # depending on the harness breaks at the same moment - and the tests above
  # would still be green, because they never install the package.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from this ref, as a consumer would
        run: pip install "harness @ git+${{ github.server_url }}/${{ github.repository }}@${{ github.sha }}"

      - name: Scaffold a project and run its checks
        run: |
          set -e
          cd "$(mktemp -d)"
          harness --help
          harness init --project smoke
          harness version
          harness spec coverage
          harness spec history
          harness list --json      # the global flag must work after the subcommand
